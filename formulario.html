<!doctype html>
<html>
  <head>
    <title>PIOR SITE DO PLANETA &copy</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="principalf">
      <div id="cabeçalho">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Logotipo_IFET.svg/1920px-Logotipo_IFET.svg.png"
          width="50px"
          height="100%"
        />
        <a href="index.html">
          <h1
            style="
              font-family: Verdana, Geneva, Tahoma, sans-serif;
              color: rgb(240, 255, 240);
              font-size: 400%;
            "
          >
             SUBAÉP
          </h1>
        </a>
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Logotipo_IFET.svg/1920px-Logotipo_IFET.svg.png"
          width="50px"
          height="100%"
        />
      </div>
      <div id="corpo">
      
        <div id="lateralf">
          <a href="index.html">
          <div id="botao4">
            <p class="C">Inicio</p>
          </div>
          </a>
          <a href="campus.html">
            <div id="botao1">
              <p class="C">Campus</p>
            </div>
          </a>
          <a href="ensino.html">
            <div id="botao2">
              <p class="C">Ensino</p>
            </div>
          </a>
          <div id="botao3">
            <p class="C">Docentes</p>
          </div>
        </div>
        <div id="centralF">
          
          <div id="forms">
            <form>
              <label>Nome do Aluno</label><br />
              <input
                type="text"
                size="30"
                required
                placeholder="Digite o nome completo"
              /><br /><br />
              <label>CPF do Aluno</label><br />
              <input
                type="text"
                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                maxlength="14"
                required
                placeholder="000.000.000-00"
              /><br /><br />
              <label>Nome do Responsável</label><br />
              <input
                type="text"
                size="30"
                required
                placeholder="Digite o nome completo"
              /><br /><br />
              <label>CPF do Responsável</label><br />
              <input
                type="text"
                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                maxlength="14"
                required
                placeholder="000.000.000-00"
              /><br /><br />
              <label>Idade do Aluno</label><br />
              <input type="number" min="0" max="100" required /><br /><br />
              <label>Data de nascimento do aluno</label><br />
              <input type="date" required /><br /><br />
              <label>Sexo do aluno</label><br />
              <input type="radio" name="sexo" required /><label>Masculino</label
              ><br />
              <input type="radio" name="sexo" required /><label>Feminino</label><br />
              <input type="radio" name="sexo" required /><label>Outros</label>
              <input type="text" placeholder="Especifique" /><br /><br />
              <label>Atividades interdiciplinares </label><br />
              <input type="checkbox" /><label>Futsal</label><br />
              <input type="checkbox" /><label>Jiu-Jitsu</label><br />
              <input type="checkbox" /><label>Xadrez</label><br />
              <input type="checkbox" /><label>Handebol</label><br />
              <input type="checkbox" /><label>Atletismo</label><br />
              <input type="checkbox" /><label>Musica</label><br /><br />
              <label>Cidade</label><br />
              <select required>
                <option>Salvador</option>
                <option>Camaçari</option>
                <option>Santo Amaro</option>
                <option>Feira de Santana</option></select
              ><br /><br />
              <label>Endereço</label><br />
              <input
                type="text"
                placeholder="CEP"
                maxlength="9"
                pattern="[0-9]{5}-[0-9]{3}"
                required
              /><br /><br />
              <input type="text" placeholder="Bairro" required /><br /><br />
              <input type="text" placeholder="Rua" required /><br /><br />
              <input type="number" placeholder="Número" required />
              <br /><br />
              <h4>Contato</h4>
              <label>Telefone 1 </label><br />
              <input type="tel" placeholder="(00) 0000-0000" required /><br /><br />
              <label>Telefone 2 </label><br />
              <input type="tel" placeholder="(00) 0000-0000"/><br /><br />
              <label>Email do Responsável</label>
              <input
                type="email"
                placeholder="exemplo@exemplo.com"
                required
              /><br /><br />
              <label>Email do Aluno</label>
              <input
                type="email"
                placeholder="exemplo@exemplo.com"
                required
              /><br /><br />


              <h4>Documentação</h4>


              <label>Indentidade do Aluno</label><br />
              <input type="file" required /><br /><br />
              <label>Boletim do Aluno</label><br />
              <input type="file" required /><br /><br />
              <label>Indentidade do Responsável</label><br />
              <input type="file" required /><br /><br />


              <button>Cadastrar</button>
              <button type="reset">Limpar</button>
            </form>
            <br />
          </div>
          
        </div>
      </div>
      
    </div>
    
  </body>
</html>
